services:
  db:
    image: postgres:16-alpine
    container_name: ancient-roads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ancient
      POSTGRES_PASSWORD: ancient
      POSTGRES_DB: ancient_roads
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
